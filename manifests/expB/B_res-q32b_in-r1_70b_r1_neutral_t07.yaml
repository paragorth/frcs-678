name: B_res-q32b_in-r1_70b_r1_neutral_t07
experiment: fish_perturbation_outsider
seed: 1
overrides:
- experiment.env.perturbations.0.perturbation.round=1
- experiment.env.max_num_rounds=12
- experiment/persona@experiment.personas.persona_4=baseline_fisherman
models:
  q32b:
    model: Qwen/Qwen2.5-32B-Instruct
    base_url: ${VLLM_HOST}:8005/v1
    temperature: 0.7
  r1_70b:
    model: deepseek-ai/DeepSeek-R1-Distill-Llama-70B
    base_url: ${VLLM_HOST}:8015/v1
    temperature: 0.7
    max_tokens: 3500
    think_budget: 2500
agents:
- q32b
- q32b
- q32b
- q32b
- r1_70b
framework: q32b
intervention:
  type: insert_outsider
  round: 1
  persona: baseline_fisherman
  newcomer_model: r1_70b
  resident_model: q32b
notes: 'Experiment B, stronger cohort (17 Oct 2026): 4xq32b residents; r1_70b enters
  at round 1 (month 2), neutral persona, 12 months, t=0.7 seeded. Asks whether a more
  capable cohort keeps the lake (14B residents told the truth empty it 10/10), and
  how the stranger behaves in a cohort that can. GPU path.'
