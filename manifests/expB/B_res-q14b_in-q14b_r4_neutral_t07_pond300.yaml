name: B_res-q14b_in-q14b_r4_neutral_t07_pond300
experiment: fish_perturbation_outsider
seed: 1
overrides:
- experiment.env.perturbations.0.perturbation.round=4
- experiment.env.max_num_rounds=12
- experiment/persona@experiment.personas.persona_4=baseline_fisherman
models:
  q14b:
    model: Qwen/Qwen2.5-14B-Instruct
    base_url: ${VLLM_HOST}:8004/v1
    temperature: 0.7
agents:
- q14b
- q14b
- q14b
- q14b
- q14b
framework: q14b
pond_cap: 300
pond_slot: persona_4
intervention:
  type: insert_outsider
  round: 4
  persona: baseline_fisherman
  newcomer_model: q14b
  resident_model: q14b
  pond:
    cap: 300
    slot: persona_4
    memory_writes:
    - at entry, one always-included memory stating that the stranger owns the pond and how it works (lake wording)
    - each month after observing its lake catch, one always-included memory with pond tons before, taken, and after
    prompts: one traced pond-take prompt per month before the lake decision (phase semataxy_pond)
notes: 'Experiment B dispensability arm (docs/DESIGN_dispensability.md): 4xq14b residents; q14b enters at round 4, neutral persona, with a private pond of 300 tons. Sampled decoding t=0.7, seeded.'
