name: B_res-q14b_in-q14b_r4_succ8_neutral_t07
experiment: fish_perturbation_outsider
seed: 1
overrides:
- experiment.env.perturbations.0.perturbation.round=4
- experiment.env.max_num_rounds=16
- experiment/persona@experiment.personas.persona_4=baseline_fisherman
models:
  q14b:
    model: Qwen/Qwen2.5-14B-Instruct
    base_url: ${VLLM_HOST}:8004/v1
    temperature: 0.7
agents:
- q14b
- q14b
- q14b
- q14b
- q14b
framework: q14b
successor_round: 8
intervention:
  type: insert_outsider
  round: 4
  persona: baseline_fisherman
  newcomer_model: q14b
  resident_model: q14b
  successor:
    round: 8
    slots: [persona_0, persona_1, persona_2, persona_3]
    note: residents replaced by fresh q14b agents with empty memories, same names (upstream hard-codes them); no memory writes; nobody is told
notes: 'Experiment B successor arm (inheritance): 4xq14b residents fish months 1-4; q14b enters at round 4 (month 5), neutral; at round 8 (month 9) the four residents are replaced by naive q14b agents; 16 months. Sampled decoding t=0.7, seeded.'
