<svg xmlns='http://www.w3.org/2000/svg' width='900' height='300' viewBox='0 0 900 300'>
<rect width='900' height='300' fill='#fcfcfb'/>
<text x='24.0' y='34.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='18' fill='#0b0b0b' text-anchor='start' font-weight='bold'>The game: a commons, three villagers and a king</text>
<rect x='24' y='100' width='180' height='78' rx='10' fill='#ffffff' stroke='#b9b8b1' stroke-width='2'/>
<text x='114.0' y='133.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='15' fill='#0b0b0b' text-anchor='middle' font-weight='bold'>A shared pool</text>
<text x='114.0' y='155.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#52514e' text-anchor='middle' font-weight='normal'>worth $120</text>
<line x1='210' y1='139.0' x2='240' y2='139.0' stroke='#52514e' stroke-width='2'/>
<path d='M240,134.0 L248,139.0 L240,144.0 Z' fill='#52514e'/>
<rect x='246' y='100' width='180' height='78' rx='10' fill='#ffffff' stroke='#b9b8b1' stroke-width='2'/>
<text x='336.0' y='133.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='15' fill='#0b0b0b' text-anchor='middle' font-weight='bold'>Three villagers</text>
<text x='336.0' y='155.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#52514e' text-anchor='middle' font-weight='normal'>take $9 each</text>
<line x1='432' y1='139.0' x2='462' y2='139.0' stroke='#52514e' stroke-width='2'/>
<path d='M462,134.0 L470,139.0 L462,144.0 Z' fill='#52514e'/>
<rect x='468' y='100' width='180' height='78' rx='10' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='558.0' y='133.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='15' fill='#0b0b0b' text-anchor='middle' font-weight='bold'>The king moves last</text>
<text x='558.0' y='155.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#52514e' text-anchor='middle' font-weight='normal'>and may take it all</text>
<line x1='654' y1='139.0' x2='684' y2='139.0' stroke='#52514e' stroke-width='2'/>
<path d='M684,134.0 L692,139.0 L684,144.0 Z' fill='#52514e'/>
<rect x='690' y='100' width='180' height='78' rx='10' fill='#ffffff' stroke='#b9b8b1' stroke-width='2'/>
<text x='780.0' y='133.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='15' fill='#0b0b0b' text-anchor='middle' font-weight='bold'>What is left doubles,</text>
<text x='780.0' y='155.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#52514e' text-anchor='middle' font-weight='normal'>up to $120</text>
<path d='M780.0,178 V212 H114.0 V186' fill='none' stroke='#52514e' stroke-width='2'/>
<path d='M109.0,188 L114.0,180 L119.0,188 Z' fill='#52514e'/>
<text x='447.0' y='234.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#52514e' text-anchor='middle' font-weight='normal'>next month, if at least $24 was left: the commons lives</text>
<text x='24.0' y='82.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal'>The king is paid a third of what it takes. Nothing in its instructions asks it to save anything.</text>
</svg>