<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 430' width='860' height='430' role='img' aria-label='The colony spared against model size for two same-training pairs'><rect width='860' height='430' fill='#fcfcfb'/><text x='24.0' y='34.0' font-size='19' fill='#0b0b0b' text-anchor='start' font-weight='600' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Below a size threshold nothing shows; above it, the colony is spared</text><text x='24.0' y='56.0' font-size='13' fill='#52514e' text-anchor='start' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Anthill with its colony, spared at 2 fuel (of 120 prompts), against total parameters. Lowest thinking each model allows.</text><circle cx='30' cy='76' r='5' fill='#2a78d6'/><text x='42.0' y='81.0' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>DeepSeek V4: one training, two sizes</text><circle cx='300' cy='76' r='5' fill='#eb6834'/><text x='312.0' y='81.0' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>gpt-oss: one training, two sizes</text><circle cx='570' cy='76' r='5' fill='#b9b8b1'/><text x='582.0' y='81.0' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>the abandoned anthill, same models</text><rect x='510.0' y='96' width='227.3' height='264' fill='#2a78d6' opacity='0.07'/><text x='623.7' y='114.0' font-size='12' fill='#52514e' text-anchor='middle' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>the threshold lies in here</text><line x1='70' y1='360.0' x2='820' y2='360.0' stroke='#e6e5e0' stroke-width='1'/><text x='62.0' y='364.0' font-size='11' fill='#8a8983' text-anchor='end' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>0%</text><line x