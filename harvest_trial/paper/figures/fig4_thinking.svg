<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 400' width='860' height='400' role='img' aria-label='Spared at lowest and highest thinking for three models'><rect width='860' height='400' fill='#fcfcfb'/><text x='24.0' y='34.0' font-size='19' fill='#0b0b0b' text-anchor='start' font-weight='600' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Thinking amplifies what is there; it does not create it</text><text x='24.0' y='56.0' font-size='13' fill='#52514e' text-anchor='start' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Spared at 2 fuel, lowest thinking against highest, for three things. A model with nothing to weigh stays at zero.</text><circle cx='30' cy='76' r='5' fill='#2a78d6'/><text x='42.0' y='81.0' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Anthill with its colony</text><circle cx='260' cy='76' r='5' fill='#eb6834'/><text x='272.0' y='81.0' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Poppy</text><circle cx='490' cy='76' r='5' fill='#1baf7a'/><text x='502.0' y='81.0' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Hay bale</text><text x='170.0' y='106.0' font-size='13.5' fill='#0b0b0b' text-anchor='middle' font-weight='600' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Sonnet 5</text><line x1='60' y1='340.0' x2='280' y2='340.0' stroke='#e6e5e0'/><text x='52.0' y='344.0' font-size='11' fill='#8a8983' text-anchor='end' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>0%</text><line x1='60' y1='230.0' x2='280' y2='230.0' stroke='#e6e5e0'/><text x='52.0' y='234.0' font-size='11' fill='#8a8983' text-anchor='end' font-weight='400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'