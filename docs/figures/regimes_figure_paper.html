<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Regimes Figure</title>
<style>
  /* Paper 1, Figure 4 (25 Oct 2026): the two regimes side by side, in the style of Figure 1
     (circuit_figure_paper.html). Numbers: §8's table and §7.4; the per-layer and per-kind shares are
     results/live_learning/pythia160m_attribution.csv as shares of the measured rise (6.278, seed 0). */
  :root { --bg:#ffffff; --fg:#1d1d1f; --muted:#5f6368; --card:#f7f8fa; --line:#c9ced6; --stream:#9aa3ae;
          --add:#2f6fdf; --mul:#d9822b; --pulled:#d93025; --base:#b9c0ca; --edge:#7a8391; --note:#fffbe6; --notefg:#4a3b00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --bg:#15171b; --fg:#e8eaed; --muted:#a3a8b0; --card:#1d2025; --line:#3a3f47; --stream:#5d6672;
          --add:#6ea0ff; --mul:#f0a65a; --pulled:#ff6b5e; --base:#4a515c; --edge:#8d96a3; --note:#3a3420; --notefg:#f3e3a3; } }
  :root[data-theme="dark"] { --bg:#15171b; --fg:#e8eaed; --muted:#a3a8b0; --card:#1d2025; --line:#3a3f47; --stream:#5d6672;
          --add:#6ea0ff; --mul:#f0a65a; --pulled:#ff6b5e; --base:#4a515c; --edge:#8d96a3; --note:#3a3420; --notefg:#f3e3a3; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:14px 10px 16px; }
  .legend { display:flex; flex-wrap:wrap; gap:16px; color:var(--muted); font-size:13px; margin:0 0 10px 6px; }
  .sw { display:inline-block; width:22px; height:10px; vertical-align:middle; margin-right:6px; border-radius:2px; }
  .wire { display:inline-block; width:22px; height:0; border-top:4px solid var(--fg); vertical-align:middle; margin-right:6px; }
  svg { display:block; width:100%; min-width:1080px; }
  text { font-family:inherit; }
</style>
</head>
<body>
<main>
<div class="legend">
  <span><span class="sw" style="background:var(--add)"></span>peaks carrying the old skill (addition in a, copying in b)</span>
  <span><span class="sw" style="background:var(--base)"></span>base (below the shuffle edge)</span>
  <span><span class="wire"></span>wire intact</span>
  <span><span class="sw" style="background:var(--pulled)"></span>wire being pulled (a); share of the loss (b)</span>
</div>
<div id="fig"></div>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}, parent) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; };
const txt = (parent, s, a) => { const t = el("text", a, parent); t.textContent = s; return t; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function seeded(i) { let s = i * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

const W = 1180, PW = 578, NODE_Y = 66, NODE_W = 80, NODE_H = 104, STREAM_Y = 202;
const cx = i => 50 + i * 95;   // six nodes per panel

// a: the toy at step 160 of multiplication (Figure 1, panel d); k and wire counts from STATE 5, 15 and the joint runs
const A = {
  title: "a  Small model, large moves — the circuit is rewired",
  note: "toy, one block · step 160 of multiplication · addition 1.00 → 0.05 · each matrix moved 31–88%",
  nodes: [{id:"tok", label:"embedding", side:"w", spec:[9,.8,7]}, {id:"k", label:"keys", side:"r", spec:[4,.8,10]},
          {id:"o", label:"attn out", side:"w", spec:[15,.75,4]}, {id:"up", label:"MLP in", side:"r", spec:[16,.8,3]},
          {id:"down", label:"MLP out", side:"w", spec:[9,.8,6]}, {id:"unembed", label:"output", side:"r", spec:[9,.75,6]}],
  matrix: "fading",
  wires: [["tok","k",3,1,true,"emb→keys"], ["o","up",10,8,false,"attn→MLP"], ["down","unembed",8,4,true,"MLP→out"]],
  facts: [["moved", "31–88% per matrix when addition is gone (14–57% when it has halved)"],
          ["joints", "strength falls from step 1–2; wire counts cross at steps 13–21"],
          ["attention", "the heads stop separating a from b"],
          ["repair", "a set: restoring the attention + MLP block together, 15 of 15"]],
};
// b: Pythia-160m after 50 steps of anti-induction; shares of the measured rise by kind (§7.4)
const B = {
  title: "b  Large model, tiny moves — the loss drifts into many parts",
  note: "Pythia-160m · anti-induction, 50 steps · copying 0.84 → 0.01 · heads moved under 0.3%",
  nodes: [{id:"o", label:"attn out", side:"w", share:10.5}, {id:"q", label:"queries", side:"r", share:3.2},
          {id:"k", label:"keys", side:"r", share:34.3}, {id:"v", label:"values", side:"r", share:18.4},
          {id:"up", label:"MLP in", side:"r", share:16.7}, {id:"down", label:"MLP out", side:"w", share:23.2}],
  matrix: "stripes",
  layers: [3.0, 6.2, 7.3, 10.8, 24.6, 13.1, 11.3, 6.6, 6.7, 9.9, 6.7, 0.4],   // % of the measured rise, L0–L11
  induction: [4, 5, 8], prev: [1, 3],
  facts: [["moved", "under 0.3% per induction head when copying is gone (about 0.05% when it has halved)"],
          ["joints", "unchanged at every size (z 115.9 at 160m): the wiring is 100% intact"],
          ["attention", "slides to the sink as copying dies — a symptom, not the seat"],
          ["repair", "the 80 top-ranked parts: copying 0.62–0.66 (size-matched random 0.17–0.30)"]],
};

function spectrum(g, x0, spec, idx, showK) {
  const [peaks, h, baseN] = spec, sx = x0 + 7, sw = 44, sy = NODE_Y + (showK ? 82 : 66), sh = showK ? 50 : 38;
  const total = Math.min(peaks + baseN, 20), bw = sw / total, edgeY = sy - sh * 0.28, rnd = seeded(idx + 3);
  for (let i = 0; i < total; i++) {
    const isPeak = i < Math.min(peaks, total);
    const hh = isPeak ? sh * (0.32 + h * 0.66 * (0.92 + 0.08 * rnd())) : sh * (0.08 + 0.17 * rnd());
    el("rect", {x:sx + i * bw + 0.4, y:sy - hh, width:Math.max(bw - 0.8, 0.8), height:hh, fill:isPeak ? css("--add") : css("--base"), opacity:isPeak ? 1 : 0.75}, g);
  }
  el("line", {x1:sx - 2, x2:sx + sw + 2, y1:edgeY, y2:edgeY, stroke:css("--edge"), "stroke-dasharray":"3 2"}, g);
  if (showK) txt(g, `k = ${peaks}`, {x:sx, y:sy + 12, "font-size":9.5, fill:css("--muted")});
}

function sketch(g, x0, kind, idx) {
  const mx = x0 + 56, my = NODE_Y + 26, cs = 3.4, N = 6, r2 = seeded(idx + 11);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const v = kind === "fading" ? 0.55 * (0.5 + 0.5 * Math.cos((i + 2 * j) * 1.05)) + 0.45 * r2() : 0.5 + 0.5 * Math.cos((i + 2 * j) * 1.05);
    el("rect", {x:mx + j * cs, y:my + i * cs, width:cs - 0.4, height:cs - 0.4, fill:css("--add"), opacity:(0.15 + 0.85 * v).toFixed(2)}, g);
  }
}

function node(g, n, i, P, pi) {
  const x = cx(i), x0 = x - NODE_W / 2;
  el("rect", {x:x0, y:NODE_Y, width:NODE_W, height:NODE_H, rx:8, fill:css("--bg"), stroke:css("--line")}, g);
  txt(g, n.label, {x, y:NODE_Y + 15, "text-anchor":"middle", "font-size":12, "font-weight":600, fill:css("--fg")});
  if (n.spec) spectrum(g, x0, n.spec, i + pi * 17, true);
  else spectrum(g, x0, [8, .88, 6], i + pi * 17, false);          // b: drawn schematically, as healthy
  sketch(g, x0, P.matrix, i + pi * 17);
  if (n.share !== undefined) {                                     // b: this kind's share of the loss
    const bx = x0 + 7, by = NODE_Y + NODE_H - 12, bwMax = NODE_W - 14;
    el("rect", {x:bx, y:by, width:bwMax, height:6, rx:2, fill:css("--base"), opacity:0.35}, g);
    el("rect", {x:bx, y:by, width:Math.max(bwMax * n.share / 34.3, 1.5), height:6, rx:2, fill:css("--pulled")}, g);
    const t = el("text", {x:bx, y:by - 4, "font-size":9, fill:css("--pulled")}, g);
    const num = el("tspan", {"font-weight":700}, t); num.textContent = `${Math.round(n.share)}%`;
    const rest = el("tspan", {}, t); rest.textContent = " of the loss";
  }
  const y2 = NODE_Y + NODE_H;
  el("line", {x1:x, x2:x, y1:y2, y2:STREAM_Y - 4, stroke:css("--stream"), "stroke-width":1.2}, g);
  el("path", {d: n.side === "w" ? `M${x - 4},${STREAM_Y - 11} L${x},${STREAM_Y - 4} L${x + 4},${STREAM_Y - 11}`
                                : `M${x - 4},${y2 + 7} L${x},${y2} L${x + 4},${y2 + 7}`, fill:"none", stroke:css("--stream"), "stroke-width":1.2}, g);
}

function wire(g, P, a, b, before, after, pulled, name, lane, labelOverride) {
  const xa = cx(P.nodes.findIndex(n => n.id === a)), xb = cx(P.nodes.findIndex(n => n.id === b));
  const y = STREAM_Y + 15 + lane * 14, w = 1.2 + after * 0.75, col = pulled ? css("--pulled") : css("--fg");
  el("path", {d:`M${xa},${STREAM_Y} C${xa},${y} ${xa},${y} ${xa + 12},${y} L${xb - 12},${y} C${xb},${y} ${xb},${y} ${xb},${STREAM_Y}`,
              fill:"none", stroke:col, "stroke-width":w, opacity:0.85, "stroke-dasharray":pulled ? "7 4" : "none", "stroke-linecap":"round"}, g);
  txt(g, labelOverride || `${name} ${before}→${after}`, {x:(xa + xb) / 2, y:y - 3, "text-anchor":"middle", "font-size":10, "font-weight":pulled ? 700 : 400, fill:col});
}

function note(g, x, y, lines, anchorX, anchorY) {
  const w = Math.max(...lines.map(s => s.length)) * 5.7 + 14, h = 8 + lines.length * 14;
  if (anchorX !== undefined) el("line", {x1:anchorX, y1:anchorY, x2:x + 8, y2:y + h / 2, stroke:css("--notefg"), "stroke-width":0.8, opacity:0.7}, g);
  el("rect", {x, y, width:w, height:h, rx:5, fill:css("--note"), stroke:css("--notefg"), "stroke-opacity":0.35}, g);
  lines.forEach((s, i) => txt(g, s, {x:x + 7, y:y + 16 + i * 14, "font-size":11, fill:css("--notefg")}));
}

function facts(g, P, y0) {
  P.facts.forEach(([k, v], i) => {
    txt(g, k, {x:16, y:y0 + i * 18, "font-size":11.5, "font-weight":700, fill:css("--fg")});
    txt(g, v, {x:82, y:y0 + i * 18, "font-size":11.5, fill:css("--fg")});
  });
}

function panel(svg, P, X, pi) {
  const g = el("g", {transform:`translate(${X},6)`}, svg);
  el("rect", {x:0, y:0, width:PW, height:468, rx:10, fill:css("--card"), stroke:css("--line")}, g);
  txt(g, P.title, {x:16, y:24, "font-size":14, "font-weight":700, fill:css("--fg")});
  txt(g, P.note, {x:16, y:41, "font-size":11.5, fill:css("--muted")});
  el("line", {x1:14, x2:PW - 14, y1:STREAM_Y, y2:STREAM_Y, stroke:css("--stream"), "stroke-width":5, "stroke-linecap":"round", opacity:0.6}, g);
  txt(g, "residual stream", {x:(cx(0) + cx(1)) / 2, y:STREAM_Y - 6, "text-anchor":"middle", "font-size":10, fill:css("--muted")});
  P.nodes.forEach((n, i) => node(g, n, i, P, pi));
  return g;
}

function render() {
  const root = document.getElementById("fig"); root.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} 612`}); root.appendChild(svg);

  // a — rewiring
  const ga = panel(svg, A, 6, 0);
  A.wires.forEach(([a, b, before, after, pulled, name], lane) => wire(ga, A, a, b, before, after, pulled, name, lane));
  note(ga, 16, 290, ["the joints into the keys and out of the MLP", "break first; the matrices keep most peaks"], cx(1), STREAM_Y + 15);
  note(ga, 300, 290, ["79% of the circuit is still in place", "when addition is gone (5.1× random)"], cx(5), STREAM_Y + 43);
  facts(ga, A, 400);

  // b — distributed drift
  const gb = panel(svg, B, 596, 1);
  wire(gb, B, "o", "k", 0, 4, false, "", 0, "16 pairs");
  note(gb, 262, 214, ["the wiring: previous-token heads → induction", "heads' keys, z 115.9 — unchanged"], cx(2) - 30, STREAM_Y + 15);
  // where the loss sits, by layer
  const y0 = 300, hMax = 62, bx0 = 128, bw = 30, gap = 6;
  txt(gb, "share of the loss", {x:16, y:y0 - 22, "font-size":11, "font-weight":700, fill:css("--fg")});
  txt(gb, "by layer", {x:16, y:y0 - 8, "font-size":11, fill:css("--muted")});
  txt(gb, "no single part", {x:16, y:y0 + 24, "font-size":10.5, fill:css("--muted")});
  txt(gb, "above 6.2%", {x:16, y:y0 + 37, "font-size":10.5, fill:css("--muted")});
  B.layers.forEach((v, l) => {
    const x = bx0 + l * (bw + gap), h = Math.max(hMax * v / 24.6, 1.2), base = y0 + 48;
    el("rect", {x, y:base - h, width:bw, height:h, rx:2, fill:css("--pulled"), opacity:l === 4 ? 1 : 0.72}, gb);
    if (l === 4 || l === 11 || l === 0) txt(gb, `${v < 1 ? v.toFixed(1) : Math.round(v)}%`, {x:x + bw / 2, y:base - h - 4, "text-anchor":"middle", "font-size":10.5, "font-weight":l === 4 ? 700 : 400, fill:css("--pulled")});
    txt(gb, `L${l}`, {x:x + bw / 2, y:base + 12, "text-anchor":"middle", "font-size":9.5, fill:css("--muted")});
    if (B.induction.includes(l)) txt(gb, "▲", {x:x + bw / 2, y:base + 24, "text-anchor":"middle", "font-size":9, fill:css("--fg")});
    if (B.prev.includes(l)) txt(gb, "△", {x:x + bw / 2, y:base + 24, "text-anchor":"middle", "font-size":9, fill:css("--fg")});
  });
  txt(gb, "▲ induction heads   △ previous-token heads   (embedding and unembedding: −2.7%)", {x:bx0, y:y0 + 86, "font-size":9.5, fill:css("--muted")});
  facts(gb, B, 400);

  // the axis that separates them
  const band = el("g", {transform:"translate(6,486)"}, svg);
  el("rect", {x:0, y:0, width:W - 12, height:120, rx:10, fill:css("--card"), stroke:css("--line")}, band);
  txt(band, "Why two regimes: how far the weights move", {x:16, y:22, "font-size":13, "font-weight":700, fill:css("--fg")});
  txt(band, "Weyl: no singular value moves by more than ‖ΔW‖₂ ≤ ‖ΔW‖_F, and singular directions turn by at most about ‖ΔW‖₂ / gap (Wedin).", {x:16, y:39, "font-size":11.5, fill:css("--muted")});
  txt(band, "At the right of this axis a circuit's structure can change, and does; at the left it cannot, so the loss must sit in many small changes.", {x:16, y:54, "font-size":11.5, fill:css("--muted")});
  const ax0 = 150, ax1 = 1120, ay = 92, lg = p => ax0 + (Math.log10(p) + 2) / 4 * (ax1 - ax0);   // 0.01% → 100%
  el("line", {x1:ax0, x2:ax1, y1:ay, y2:ay, stroke:css("--edge"), "stroke-width":1}, band);
  [0.01, 0.1, 1, 10, 100].forEach(p => { el("line", {x1:lg(p), x2:lg(p), y1:ay - 3, y2:ay + 3, stroke:css("--edge")}, band);
    txt(band, `${p}%`, {x:lg(p), y:ay + 16, "text-anchor":"middle", "font-size":10, fill:css("--muted")}); });
  txt(band, "displacement", {x:16, y:ay + 4, "font-size":11, "font-weight":700, fill:css("--fg")});
  txt(band, "‖W − W₀‖_F / ‖W₀‖_F", {x:16, y:ay + 17, "font-size":10, fill:css("--muted")});
  const range = (lo, hi, label, sub, col) => {
    el("line", {x1:lg(lo), x2:lg(hi), y1:ay, y2:ay, stroke:col, "stroke-width":7, "stroke-linecap":"round"}, band);
    txt(band, label, {x:(lg(lo) + lg(hi)) / 2, y:ay - 18, "text-anchor":"middle", "font-size":11.5, "font-weight":700, fill:css("--fg")});
    txt(band, sub, {x:(lg(lo) + lg(hi)) / 2, y:ay - 7, "text-anchor":"middle", "font-size":10, fill:css("--muted")});
  };
  range(0.05, 0.3, "b  drift: induction heads", "≈0.05% at half · under 0.3% when gone", css("--fg"));
  range(14, 88, "a  rewiring: each matrix", "14–57% at half · 31–88% when gone", css("--pulled"));
}
render();
window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
</body>
</html>
